name: Rotate profile theme

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-theme.yml'
      - '.github/scripts/rotate-theme.py'

permissions:
  contents: write

concurrency:
  group: profile-theme-main
  cancel-in-progress: false

jobs:
  rotate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Choose a different theme
        id: theme
        run: python3 .github/scripts/rotate-theme.py
      - name: Publish profile theme
        env:
          THEME: ${{ steps.theme.outputs.theme }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md
          git commit -m "Rotate profile theme to ${THEME}"
          git push origin HEAD:main
